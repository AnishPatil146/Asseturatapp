<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #0b0e17;
      overflow: hidden;
    }

    .tradingview-widget-container {
      width: 100%;
      height: 100%;
    }

    #tv_chart_container {
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>

<body>
  <div class="tradingview-widget-container">
    <div id="tv_chart_container"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Read symbol + interval from query params passed by the React parent via the iframe 'src' URL
      const params = new URLSearchParams(window.location.search);
      const symbolParam = params.get('symbol') || 'BINANCE:BTCUSDT';
      const intervalParam = params.get('interval') || '60';

      // Initialize the widget safely after the DOM has loaded
      new TradingView.widget({
        autosize: true,
        symbol: symbolParam,
        interval: intervalParam,
        theme: 'dark',
        style: '1',
        locale: 'en',
        timezone: 'Etc/UTC',
        backgroundColor: '#0b0e17',
        gridColor: 'rgba(255,255,255,0.04)',
        hide_side_toolbar: false,
        allow_symbol_change: true,
        save_image: true,
        hide_volume: false,
        container_id: 'tv_chart_container',
        support_host: 'https://www.tradingview.com'
      });
    });
  </script>
</body>

</html>
